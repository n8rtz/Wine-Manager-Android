# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Tuned for the owner's 16 GB phone (12 GB extended RAM covers spikes).
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g
# Parallel project execution plus the local build cache (reuses task outputs across
# clean builds and branch switches; the cache lives in the Gradle home and can be
# pruned with `gradlew --stop` + deleting caches/build-cache-* if space gets tight).
org.gradle.parallel=true
org.gradle.caching=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
android.disallowKotlinSourceSets=false
# 4 workers keep Kotlin/D8/AAPT2 moving on the 8-core phone without sustained all-core
# thermal throttling. workers.max=1 was the workaround for an on-device AAPT2 second-daemon
# startup failure (observed during androidx.core resource compilation) — if that failure
# returns, drop this back to 1 (or try 2) instead of fighting it.
org.gradle.workers.max=4
