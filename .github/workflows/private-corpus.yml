name: Private corpus real Android OCR
on:
  push:
    branches: ['arena/fd8dc3be-wine-manager-android']
    paths: ['.github/workflows/private-corpus.yml', 'app/src/androidTest/java/com/yourapp/wine/textlab/PublicCorpusDeviceTest.kt', 'tools/corpus/run_android_corpus.sh']
  workflow_dispatch:
    inputs:
      limit:
        description: 'Distinct images (1–168); first prove both engines with 3'
        default: '3'
        required: true
permissions:
  contents: read
  checks: write
concurrency:
  group: private-corpus-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CORPUS_LIMIT: ${{ inputs.limit || '3' }}
    steps:
      - name: Set private working directories
        run: |
          echo "CORPUS_DIR=$RUNNER_TEMP/private-corpus" >> "$GITHUB_ENV"
          echo "CORPUS_RESULTS=$RUNNER_TEMP/corpus-results" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v5
      - name: Acquire private candidate photos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install Pillow==13.0.0
          python3 tools/corpus/acquire_public_labels.py --output "$CORPUS_DIR" --private-review-unlicensed
          python3 tools/corpus/validate_corpus.py "$CORPUS_DIR"
      - name: Build unchanged arm64 app and opt-in test
        run: ./gradlew --no-daemon --console=plain :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute actual OCR Lab pipeline
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          heap-size: 256M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          script: bash tools/corpus/run_android_corpus.sh
      - name: Retain diagnostics, never corpus photos
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: private-corpus-results
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/corpus-results
            app/build/outputs/logs
      - name: Publish accessible execution diagnostics
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const root = process.env.CORPUS_RESULTS;
            let text = 'Private candidate corpus; annotations not yet scoring truth. Emulator timing is not phone performance.\n';
            for (const name of ['instrumentation.txt', 'emulator-properties.txt']) {
              const path = `${root}/${name}`;
              if (fs.existsSync(path)) text += `\n${name}\n${fs.readFileSync(path, 'utf8').slice(0, 12000)}\n`;
            }
            const dir = `${root}/results`;
            if (fs.existsSync(dir)) {
              for (const name of fs.readdirSync(dir).filter(n => n.endsWith('.csv')).slice(0,3)) {
                text += `\n${name}\n${fs.readFileSync(`${dir}/${name}`, 'utf8').slice(-8000)}\n`;
              }
            }
            await github.rest.checks.create({...context.repo, name: 'Corpus execution diagnostics', head_sha: context.sha,
              status: 'completed', conclusion: 'neutral', output: {title: 'Real Android corpus diagnostics (not an accuracy score)', summary: text.slice(0, 60000)}});
