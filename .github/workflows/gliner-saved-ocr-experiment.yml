name: GLiNER saved-OCR experiment
on:
  push:
    branches: ['arena/1bab4a14-wine-manager-android']
    paths:
      - '.github/workflows/gliner-saved-ocr-experiment.yml'
      - 'tools/gliner-experiment/**'
      - 'tools/host-lab/GlinerDecisionReplay.kt'
      - 'tools/host-lab/replay_gliner_decisions.py'
      - 'tools/logic-checks/AndroidGeometry.kt'
      - 'gliner-workflow/src/main/java/com/yourapp/wine/gliner/**'
      - 'gliner-workflow/src/appIntegration/java/com/yourapp/wine/gliner/GlinerFusion.kt'
      - 'gliner-workflow/src/appIntegration/java/com/yourapp/wine/gliner/GlinerCatalogIndexes.kt'
      - 'app/src/main/java/com/yourapp/wine/merge/TextNorm.kt'
      - 'app/src/main/java/com/yourapp/wine/merge/BoxMath.kt'
      - 'app/src/main/java/com/yourapp/wine/kb/**'
  workflow_dispatch:
permissions:
  contents: write
  checks: write
concurrency:
  group: gliner-saved-ocr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Create temporary results directory
        run: mkdir -p "$RUNNER_TEMP/gliner-results"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare host-only test dependencies
        run: |
          python -m pip install 'numpy<2' 'onnxruntime==1.21.1'
          npm install --prefix "$RUNNER_TEMP/kotlin" kotlin-compiler@2.2.10 --silent
          git clone --quiet --depth 1 --branch 20240303 https://github.com/stleary/JSON-java.git "$RUNNER_TEMP/json-java"
          mkdir "$RUNNER_TEMP/json-classes"
          javac -d "$RUNNER_TEMP/json-classes" "$RUNNER_TEMP/json-java"/src/main/java/org/json/*.java
          jar cf "$RUNNER_TEMP/json.jar" -C "$RUNNER_TEMP/json-classes" .
          echo "KOTLIN_HOME=$RUNNER_TEMP/kotlin/node_modules/kotlin-compiler" >> "$GITHUB_ENV"
          echo "JSON_JAR=$RUNNER_TEMP/json.jar" >> "$GITHUB_ENV"
          echo "GLINER_HOST=$RUNNER_TEMP/host" >> "$GITHUB_ENV"
      - name: Compile the actual Kotlin OCR fusion, tokenizer and decision policy
        run: bash tools/gliner-experiment/build-host.sh "$GLINER_HOST" 2>&1 | tee -a "$RUNNER_TEMP/gliner-results/trace.txt"
      - name: Check test machinery and saved phone control
        run: python -m unittest discover -s tools/gliner-experiment -p 'test_*.py' -v 2>&1 | tee -a "$RUNNER_TEMP/gliner-results/trace.txt"
      - name: Download the existing pinned INT4 model (runner temporary storage only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/bundle"
          gh release download gliner-small-int4-v1 --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/bundle" \
            -p gliner_small_int4.onnx -p tokenizer.json -p gliner_config.json 2>&1 | tee -a "$RUNNER_TEMP/gliner-results/trace.txt"
      - name: Run all prompt sets and automatically score all variants
        run: python tools/gliner-experiment/run.py --bundle "$RUNNER_TEMP/bundle" --host "$GLINER_HOST" --output "$RUNNER_TEMP/gliner-results/report.json" 2>&1 | tee -a "$RUNNER_TEMP/gliner-results/trace.txt"
      - name: Render result, including failures
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/gliner-results"
          python tools/gliner-experiment/summary.py "$RUNNER_TEMP/gliner-results/report.json" | tee "$RUNNER_TEMP/gliner-results/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gliner-saved-ocr-results
          path: ${{ runner.temp }}/gliner-results/
          retention-days: 14
      - name: Publish phone-readable aggregate and diagnostic check
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const p = `${process.env.RUNNER_TEMP}/gliner-results/summary.md`;
            let text = fs.existsSync(p) ? fs.readFileSync(p, 'utf8') : 'The experiment failed before a report was produced. Inspect workflow steps.';
            const trace = `${process.env.RUNNER_TEMP}/gliner-results/trace.txt`;
            if ('${{ job.status }}' !== 'success' && fs.existsSync(trace)) text += `\n\nFailure trace (tail):\n\`\`\`\n${fs.readFileSync(trace, 'utf8').slice(-12000)}\n\`\`\``;
            await github.rest.checks.create({...context.repo, name:'GLiNER saved-OCR comparison results', head_sha:context.sha,
              status:'completed', conclusion:'neutral', output:{title:'GLiNER saved-OCR results',summary:text.slice(0,60000)}});

  model-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch existing tested bundle into temporary runner storage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/transfer"
          gh release download gliner-small-int4-v1 --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/transfer" \
            -p gliner_small_int4.onnx -p tokenizer.json -p gliner_config.json
      - name: Verify, split and stage temporary unreferenced blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import base64, hashlib, json, os, pathlib, subprocess
          folder=pathlib.Path(os.environ['RUNNER_TEMP'])/'transfer'
          expected={'gliner_small_int4.onnx':'a4d97745ba14a2b5f3606b30fa46a4c9a78e7b78a5f8b6c9e9fb35078d7c4a6d', 'tokenizer.json':'1731c431e5e851a4a73487b5bbfbef265b29ab64de190c402b4e6df9ce2cb0ab', 'gliner_config.json':'74fa245ddcaf2ad5ec1c611d197b829a352ada033d14c797564a67ffe2902365'}
          manifest=[]
          def stage(name,data):
              request=folder/'request.json'
              request.write_text(json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}))
              result=subprocess.run(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs",'--method','POST','--input',str(request)],check=True,capture_output=True,text=True)
              manifest.append({'name':name,'size':len(data),'sha256':hashlib.sha256(data).hexdigest(),'blob':json.loads(result.stdout)['sha']})
              request.unlink()
          for name,sha in expected.items():
              path=folder/name
              h=hashlib.sha256()
              with path.open('rb') as f:
                  while block:=f.read(1024*1024): h.update(block)
              if h.hexdigest()!=sha: raise SystemExit('Bundle SHA mismatch: '+name)
              if name.endswith('.onnx'):
                  with path.open('rb') as f:
                      index=1
                      while chunk:=f.read(40_000_000):
                          stage(f'gliner_small_int4.onnx.part-{index:02}',chunk);index+=1
              else: stage(name,path.read_bytes())
          (folder/'transfer.json').write_text(json.dumps(manifest))
          PYCODE
      - name: Surface temporary blob identifiers
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const p = `${process.env.RUNNER_TEMP}/transfer/transfer.json`;
            const summary = fs.existsSync(p) ? fs.readFileSync(p,'utf8') : 'Transfer failed before all temporary blobs were staged.';
            await github.rest.checks.create({...context.repo, name:'Temporary model transfer', head_sha:context.sha,
              status:'completed', conclusion:'neutral', output:{title:'Temporary model transfer',summary}});
