name: Recover completed producer evaluation without rerunning Android
on:
  push:
    branches: ['arena/fd8dc3be-wine-manager-android']
    paths: ['.github/workflows/collect-producer-results.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
  checks: write
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify source execution identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/runs/39854457095 > "$RUNNER_TEMP/source.json"
          python3 - "$RUNNER_TEMP/source.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['status']=='completed' and r['head_sha']=='45c3bbe468daabb57b931f63cbe362c3a14b0e86'
          assert r['head_branch']=='arena/fd8dc3be-wine-manager-android'
          PY
      - uses: actions/download-artifact@v5
        with:
          name: producer-iteration
          run-id: 39854457095
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/producer-source
      - name: Score saved Android outputs
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/tests
          python3 tools/corpus/producer_iteration.py collect "$RUNNER_TEMP/producer-source" tools/evaluation/producer-iteration-39854457095 --sha 45c3bbe468daabb57b931f63cbe362c3a14b0e86 2>&1 | tee "$RUNNER_TEMP/producer-collection.txt"
          cat tools/evaluation/producer-iteration-39854457095/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve outputs or recovery evidence
        if: always()
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/producer-source" <<'PY'
          from pathlib import Path
          import sys,gzip,json,hashlib
          root=Path(sys.argv[1]);out=Path('tools/evaluation/producer-iteration-39854457095');out.mkdir(exist_ok=True)
          for name in ['validation.json','instrumentation.txt']:
            if (root/name).exists():(out/name).write_bytes((root/name).read_bytes())
          if (root/'results.jsonl').exists():
            with gzip.open(out/'android-results.jsonl.gz','wb') as f:f.write((root/'results.jsonl').read_bytes())
          if (root/'input.json').exists():(out/'device-input.sha256').write_text(hashlib.sha256((root/'input.json').read_bytes()).hexdigest()+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/evaluation/producer-iteration-39854457095
          git diff --cached --quiet && exit 0
          git commit -m 'Preserve completed Android producer evaluation and recovery evidence'
          git push origin HEAD:arena/fd8dc3be-wine-manager-android
      - name: Publish recovery diagnostics
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const p=`${process.env.RUNNER_TEMP}/producer-collection.txt`;
            const report='tools/evaluation/producer-iteration-39854457095/report.md';
            let text=fs.existsSync(p)?fs.readFileSync(p,'utf8').slice(-20000):'Collection did not run.';
            if(fs.existsSync(report))text+='\n'+fs.readFileSync(report,'utf8');
            await github.rest.checks.create({...context.repo,name:'Producer collection diagnostics',head_sha:context.sha,status:'completed',conclusion:'neutral',output:{title:'Producer result recovery',summary:text.slice(0,60000)}});
