name: Offline scanner Android checks
on:
  pull_request:
  push:
    branches: ['arena/**', 'main', 'master']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK and minimal native toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Cache reproducible OpenCV source and arm64 outputs
        uses: actions/cache@v4
        with:
          path: |
            opencv-minimal/build/vendor
            opencv-minimal/build/native
            opencv-minimal/build/generated
          key: opencv-4.12.0-ndk28.2-${{ runner.os }}-${{ hashFiles('tools/build-opencv-minimal.py', 'opencv-minimal/build.gradle.kts') }}
      - name: Guard local recognition against recurring wine-network calls
        run: python3 tools/check-offline-recognition-boundary.py
      - name: Check production import SQL on host SQLite FTS5
        run: python3 tools/check-kb-import-sql.py
      - name: Compile real Android app
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Scanner Robolectric and deadline tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests 'com.yourapp.wine.*'
      - name: Measure arm64 release APK budget
        run: ./gradlew --no-daemon :app:checkArm64ApkBudget
      - name: Upload test results and release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-check-results
          if-no-files-found: ignore
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/outputs/apk/release/*.apk
