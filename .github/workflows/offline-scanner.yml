name: Offline scanner Android checks
on:
  pull_request:
  push:
    branches: ['arena/**', 'main', 'master']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-scanner-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Guard local recognition against recurring wine-network calls
        run: python3 tools/check-offline-recognition-boundary.py
      - name: Check production import SQL on host SQLite FTS5
        run: python3 tools/check-kb-import-sql.py
      - name: Use the hosted runner's genuine Android SDK
        shell: bash
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk" || ! -x "$sdk/cmdline-tools/latest/bin/sdkmanager" ]]; then
            echo '::error::Hosted runner Android SDK is missing; no substitute SDK is permitted.'
            exit 1
          fi
          export ANDROID_HOME="$sdk" ANDROID_SDK_ROOT="$sdk"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          bash tools/run-ci-check.sh 'Android SDK license acceptance' bash -c 'yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses'
      - uses: gradle/actions/setup-gradle@v5
      - name: Install pinned SDK and minimal native toolchain
        run: bash tools/run-ci-check.sh 'Android SDK/NDK installation' sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Cache reproducible OpenCV source and arm64 outputs
        uses: actions/cache@v5
        with:
          path: |
            opencv-minimal/build/vendor
            opencv-minimal/build/native
            opencv-minimal/build/generated
          key: opencv-4.12.0-ndk28.2-${{ runner.os }}-${{ hashFiles('tools/build-opencv-minimal.py', 'opencv-minimal/build.gradle.kts') }}
      - name: Compile real Android app
        run: bash tools/run-ci-check.sh 'Android debug compilation' ./gradlew --no-daemon --console=plain :app:assembleDebug
      - name: Compile instrumented scanner tests (device execution is separate)
        run: bash tools/run-ci-check.sh 'Android instrumentation test compilation' ./gradlew --no-daemon --console=plain :app:assembleDebugAndroidTest
      - name: Scanner Robolectric and deadline tests
        run: bash tools/run-ci-check.sh 'Scanner Robolectric tests' ./gradlew --no-daemon --console=plain :app:testDebugUnitTest --tests 'com.yourapp.wine.*'
      - name: Measure arm64 release APK budget
        run: bash tools/run-ci-check.sh 'Arm64 release APK budget' ./gradlew --no-daemon --console=plain :app:checkArm64ApkBudget
      - name: Upload test results and release APK
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: scanner-check-results
          if-no-files-found: ignore
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/outputs/apk/release/*.apk
