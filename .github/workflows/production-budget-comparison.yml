name: Production 60s budget comparison
on:
  push:
    branches: ['arena/fd8dc3be-wine-manager-android']
    paths: ['.github/workflows/production-budget-comparison.yml']
  workflow_dispatch:
permissions:
  contents: write
  checks: write
concurrency:
  group: production-budget-comparison-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      CORPUS_LIMIT: '168'
      CORPUS_ABI: x86_64
    steps:
      - name: Set private working directories
        run: |
          echo "CORPUS_DIR=$RUNNER_TEMP/private-corpus" >> "$GITHUB_ENV"
          echo "CORPUS_RESULTS=$RUNNER_TEMP/corpus-results" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/corpus-results"
      - uses: actions/checkout@v5
        with:
          # Baseline equivalence check needs the original 15s source commit.
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ vars.WINE_ENABLE_CI_CACHE_WRITES != 'true' }}
      - name: Acquire private candidate photos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install Pillow==13.0.0
          python3 tools/corpus/acquire_public_labels.py --output "$CORPUS_DIR" --private-review-unlicensed 2>&1 | tee "$CORPUS_RESULTS/acquisition.txt"
          python3 tools/corpus/validate_corpus.py "$CORPUS_DIR"
      - name: Apply and record the sole CI-only scanner change
        run: |
          exec > >(tee "$CORPUS_RESULTS/budget-setup.txt") 2>&1
          python3 - <<'PYCODE'
          import hashlib, json, os, subprocess
          from pathlib import Path
          p=Path('app/src/main/java/com/yourapp/wine/ocr/ScanDeadline.kt')
          original=p.read_text()
          assert original.count('const val BUDGET_MS = 15_000L') == 1
          # Ensure production implementation is identical to the original frozen run.
          diff=subprocess.check_output(['git','diff','80d5d8eb43ace0d24752acb5ebdfb89cb6973d0e','HEAD','--','app/src/main','app/src/debug','app/src/androidTest','app/build.gradle.kts'])
          assert not diff, 'Scanner/harness changed since baseline: review before comparing'
          modified=original.replace('const val BUDGET_MS = 15_000L','const val BUDGET_MS = 60_000L')
          p.write_text(modified)
          data=dict(production_budget_ms=60000,baseline_budget_ms=15000,
                    source_commit=os.environ['GITHUB_SHA'],baseline_run='39716483937',
                    source_modification='CI-only replacement of ScanDeadline.BUDGET_MS; no normal app change',
                    original_sha256=hashlib.sha256(original.encode()).hexdigest(),
                    modified_sha256=hashlib.sha256(modified.encode()).hexdigest())
          root=Path(os.environ['CORPUS_RESULTS'])
          (root/'budget-build.json').write_text(json.dumps(data,indent=2)+'\n')
          (root/'budget-build.patch').write_bytes(subprocess.check_output(['git','diff','--',str(p)]))
          PYCODE
      - name: Build CI-only native x86 debug app and test
        run: ./gradlew --no-daemon --console=plain -PprivateCorpusX86=true :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee "$CORPUS_RESULTS/build.txt"
      - name: Reserve emulator disk space on the disposable CI runner
        run: |
          # Both APKs are already built. No source/native builds occur after this point.
          # Remove only preinstalled toolchains unused by this Android runtime test.
          df -h | tee "$CORPUS_RESULTS/disk.txt"
          sudo rm -rf /usr/share/dotnet /usr/local/swift "$ANDROID_HOME/ndk"
          df -h | tee -a "$CORPUS_RESULTS/disk.txt"
          free_kib=$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 {print $4}')
          test "$free_kib" -gt 12582912
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute actual OCR Lab pipeline
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 3G
          ram-size: 4096M
          heap-size: 256M
          disable-linux-hw-accel: false
          emulator-boot-timeout: 360
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 4096 -feature -Vulkan -verbose > "$CORPUS_RESULTS/emulator-boot.txt" 2>&1
          script: bash tools/corpus/run_android_corpus.sh
      - name: Summarize execution coverage without inventing accuracy
        if: always()
        run: python3 tools/corpus/summarize_android.py "$CORPUS_RESULTS" --require-complete
      - name: Export verified outputs and compare frozen production references
        run: |
          dest="tools/evaluation/production-60s-${{ github.run_id }}"
          python3 tools/corpus/export_android_run.py "$CORPUS_RESULTS" "$dest" --run-id '${{ github.run_id }}' --source-commit '${{ github.sha }}'
          cp "$CORPUS_RESULTS/budget-build.json" "$CORPUS_RESULTS/budget-build.patch" "$dest/"
          python3 tools/corpus/compare_production_budgets.py "$dest" "$dest"
          cat "$dest/comparison.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve comparison on the approved session branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'tools/evaluation/production-60s-${{ github.run_id }}'
          git commit -m 'Preserve verified 60s production budget comparison'
          git push origin HEAD:arena/fd8dc3be-wine-manager-android
      - name: Retain diagnostics, never corpus photos
        if: always() && vars.WINE_UPLOAD_ACTIONS_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: private-corpus-results
          retention-days: 1
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/corpus-results
            app/build/outputs/logs
      - name: Publish accessible execution diagnostics
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const root = process.env.CORPUS_RESULTS;
            let text = 'Private candidate corpus; annotations not yet scoring truth. Emulator timing is not phone performance.\n';
            for (const name of ['budget-setup.txt', 'budget-build.json', 'corpus-summary.json', 'input-hashes.tsv', 'disk.txt', 'build.txt', 'emulator-boot.txt', 'instrumentation.txt', 'emulator-properties.txt']) {
              const path = `${root}/${name}`;
              if (fs.existsSync(path)) text += `\n${name}\n${fs.readFileSync(path, 'utf8').slice(-5000)}\n`;
            }
            const dir = `${root}/results`;
            if (fs.existsSync(dir)) {
              for (const name of fs.readdirSync(dir).filter(n => n.endsWith('.csv')).slice(0,3)) {
                text += `\n${name}\n${fs.readFileSync(`${dir}/${name}`, 'utf8').slice(-8000)}\n`;
              }
            }
            await github.rest.checks.create({...context.repo, name: 'Corpus execution diagnostics', head_sha: context.sha,
              status: 'completed', conclusion: 'neutral', output: {title: 'Real Android corpus diagnostics (not an accuracy score)', summary: text.slice(0, 60000)}});
